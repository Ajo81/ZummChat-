<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#00ff66">
  <meta name="author" content="José Yudier Arencibia Ajo">
  <meta name="creator" content="José Yudier Arencibia Ajo">
  <meta name="copyright" content="José Yudier Arencibia Ajo - 2026">
  <title>ZummChat</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="splash">
    <canvas id="matrixRain"></canvas>
    <img src="logo.png" id="logo" alt="Zunzún">
    <h2 class="matrix-text">ZummChat</h2>
  </div>

  <div id="chat-container">
    <div id="chat-header">
      <span id="chat-title">ZummChat · General</span>
      <div id="header-buttons">
        <button id="themeBtn" type="button" title="Modo claro/oscuro">🌙</button>
        <button id="colorBtn" type="button" title="Cambiar color">🎨</button>
        <button id="searchBtn" type="button" title="Buscar">🔍</button>
        <button id="soundBtn" type="button" title="Sonido">🔔</button>
        <button id="callBtn" type="button" title="Llamada de voz">📞</button>
        <button id="videoBtn" type="button" title="Videollamada">📹</button>
        <button id="usersBtn" type="button" title="Usuarios en línea">👥</button>
        <button id="shareBtn" type="button">📤</button>
      </div>
    </div>

    <div id="searchBar">
      <input type="text" id="searchInput" placeholder="Buscar en este chat..." autocomplete="off">
      <button id="searchClose" type="button">✕</button>
    </div>

    <div id="room-bar">
      <button class="room-btn active" data-room="general">General</button>
      <button class="room-btn" data-room="amigos">Amigos</button>
      <button class="room-btn" data-room="familia">Familia</button>
      <button class="room-btn" data-room="trabajo">Trabajo</button>
      <button id="addRoomBtn" class="room-btn-add" type="button" title="Crear grupo">➕</button>
    </div>

    <div id="priv-section">
      <div id="priv-bar">
        <button id="privateBtn" type="button">🔒 Chat privado</button>
      </div>
      <div id="priv-room-bar"></div>
    </div>

    <div id="messages"></div>

    <button id="scrollDownBtn" type="button" title="Ir al último mensaje">⬇️</button>

    <div id="emoji-bar"></div>

    <div id="input-area">
      <button id="emojiBtn" type="button">😀</button>
      <button id="fileBtn" type="button">📎</button>
      <button id="voiceBtn" type="button" title="Nota de voz">🎤</button>
      <input type="file" id="fileInput" accept="image/*,application/pdf,.doc,.docx,.txt" style="display:none">
      <input type="text" id="messageInput" placeholder="Escribe un mensaje..." maxlength="500" autocomplete="off">
      <button id="sendBtn" type="button">Enviar</button>
    </div>

    <div id="recordingPanel">
      <div id="recordingIndicator">🔴 Grabando... <span id="recordingTime">0:00</span></div>
      <div id="recordingActions">
        <button id="cancelRecBtn" type="button">❌ Cancelar</button>
        <button id="stopRecBtn" type="button">✅ Enviar</button>
      </div>
    </div>

    <div id="footer-credit">
      Creado por <strong>José Yudier Arencibia Ajo</strong> · ZummChat © 2026
    </div>
  </div>

  <div id="usersPanel">
    <div id="usersPanelHeader">
      <span>👥 En línea</span>
      <button id="usersPanelClose" type="button">✕</button>
    </div>
    <div id="userMeSection">
      <div id="userMeAvatar" title="Cambiar foto">👤</div>
      <span id="userMeName">Tú: ...</span>
      <button id="changeNameBtn" type="button" title="Cambiar nombre">✏️</button>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none">
    <ul id="userList"></ul>
    <p id="noUsers">Conectando...</p>
  </div>

  <div id="callOverlay">
    <div class="call-box">
      <p id="callStatus">Llamando...</p>
      <div class="videos">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>
        <div id="audioAvatar"></div>
      </div>
      <div class="call-actions">
        <button id="switchCamBtn" type="button" title="Cambiar cámara" style="display:none">🔄 Cám</button>
        <button id="muteBtn" type="button">🎤 Mic</button>
        <button id="acceptCallBtn" type="button" style="display:none">✅ Contestar</button>
        <button id="hangupBtn" type="button">❌ Colgar</button>
      </div>
    </div>
  </div>

  <div id="incomingModal">
    <div class="incoming-content">
      <div class="incoming-avatar" id="incomingAvatar">?</div>
      <div class="incoming-name" id="incomingName">Alguien</div>
      <div class="incoming-text" id="incomingText">Llamada entrante...</div>
      <div class="incoming-actions">
        <button id="rejectBtn" type="button" title="Rechazar">❌</button>
        <button id="incomingAcceptBtn" type="button" title="Aceptar">✅</button>
      </div>
    </div>
  </div>

  <div id="editModal">
    <div class="edit-content">
      <h3>✏️ Editar mensaje</h3>
      <textarea id="editInput" maxlength="500"></textarea>
      <div class="edit-actions">
        <button id="editCancelBtn" type="button">Cancelar</button>
        <button id="editSaveBtn" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <div id="msgMenu">
    <button id="menuCopyBtn" type="button">📋 Copiar</button>
    <button id="menuEditBtn" type="button">✏️ Editar</button>
    <button id="menuDeleteBtn" type="button">🗑️ Borrar</button>
  </div>

  <div id="reactionPicker">
    <button data-emoji="❤️">❤️</button>
    <button data-emoji="👍">👍</button>
    <button data-emoji="😂">😂</button>
    <button data-emoji="😮">😮</button>
    <button data-emoji="😢">😢</button>
    <button data-emoji="🔥">🔥</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4"></script>
  <script src="matrix.js"></script>
  <script src="app3.js"></script>
  <script>
    try {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      }
    } catch (e) {}
  </script>
</body>
</html>
